name: Paper X - Coupled Co-Scaling Law (verify + tests)

# Runs the deterministic, offline checks only: the verification harness, both pytest
# suites, and the synthetic beta/k estimator. It does NOT run the real-model harness
# (live API calls; see papers/.../SECURITY.md).

on:
  push:
    paths:
      - 'papers/Paper-X-Coupled-CoScaling-Correction/**'
      - '.github/workflows/paperx-ci.yml'
  pull_request:
    paths:
      - 'papers/Paper-X-Coupled-CoScaling-Correction/**'
      - '.github/workflows/paperx-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: papers/Paper-X-Coupled-CoScaling-Correction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verification harness (code matches the maths)
        run: cd code && python experiment_coscaling.py
      - name: Regression suite
        run: cd code && python -m pytest test_coscaling.py -q
      - name: Independent theorem suite (no harness import)
        run: cd code && python -m pytest test_theorems_independent.py -q
      - name: Synthetic estimator validation
        run: cd experiments/scripts && python estimate_exponents.py --selftest
